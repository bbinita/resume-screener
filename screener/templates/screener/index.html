{% extends "screener/base.html" %} {% block title %}Resume Screener{% endblock%}
{% block content %}
<h1 class="site-title">Resume Screener</h1>
<p class="site-subtitle">
  Upload your resume and paste a job description to see how well you match.
</p>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form
  method="POST"
  enctype="multipart/form-data"
  action="{% url 'result' %}"
  onsubmit="
    document.getElementById('submit-btn').innerText = 'Analyzing...';
    document.getElementById('submit-btn').disabled = true;
  "
>
  {% csrf_token %}
  <div>
    <label for="resume">Upload Resume (PDF only):</label><br />
    <input type="file" id="resume" name="resume" accept=".pdf" required />
  </div>
  <br />
  <div>
    <label for="job_description">Paste Job Description:</label><br />
    <textarea
      id="job_description"
      name="job_description"
      placeholder="Paste job description here..."
      required
    ></textarea>
  </div>
  <br />
  <button type="submit" id="submit-btn">Analyze</button>
</form>
{% endblock %}
